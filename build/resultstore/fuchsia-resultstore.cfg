# This a configuration file for rsclient's rsproxy tool.
# Values in this file can be overridden by corresponding
# environment variables that start with "RS_".
# See rsclient:internal/pkg/rsflag.go.

rs_service=resultstore.googleapis.com:443

# Fallback ResultStore and CAS instance names, and results viewer URL.
# Actual ResultStore execution dynamically overrides these via environment
# variables set by active ResultStore profiles (run `fx resultstore profile`
# to view or select). Profile definitions reside in `build/resultstore/profiles/`.
rs_instance=projects/unused-fallback-rs-instance/instances/default
cas_instance=projects/unused-fallback-rs-instance/instances/default
results_url=http://unused-fallback-results-url

cas_service=remotebuildexecution.googleapis.com:443

# Identify project.
project_id=fuchsia

# Authentication.  Default to using ADC.
use_application_default_credentials=true
