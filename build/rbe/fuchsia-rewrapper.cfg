# This a configuration file for reclient's rewrapper tool.

# Fallback platform execution properties.
# This is a placeholder value; actual RBE execution dynamically overrides this
# via the RBE_platform environment variable set by active RBE profiles (run
# `fx rbe profile` to view or select). Profile definitions reside in
# `build/rbe/profiles/`.
platform=container-image=docker://unused-fallback-container-image,Pool=unused-fallback-pool

# Limit remote execution time for any single job.
exec_timeout=20m
# Limit client-side wait time for a response from RBE (just over exec_timeout).
reclient_timeout=21m

# The following variables are overridden by their corresponding
# RBE_* environment variables in build/rbe/fuchsia-reproxy-wrap.sh:

# An empty string value is expected to induce a fast failure.
# We should never leave this unset, because rewrapper may fall back to
# an internal default value like "127.0.0.1:8000", and then fail by
# timing out after a few minutes, which is too slow to find out that
# something is very wrong.
server_address=

log_dir=/tmp
