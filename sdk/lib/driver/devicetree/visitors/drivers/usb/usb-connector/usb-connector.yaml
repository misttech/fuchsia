%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/usb-connector.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: USB Connector Provider and Consumer

maintainers:
  - Ruby Zhuang (rdzhuang@google.com)

description: |
  Links a USB controller or PHY to the USB connector (e.g. Type-C Port
  Controller) that reports cable orientation and data role via
  fuchsia.hardware.usb.connector.Service.

properties:
  usb-connector:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: Phandles of the USB connectors associated with this device.

  usb-connector-names:
    $ref: /schemas/types.yaml#/definitions/string-array
    description:
      Name for each `usb-connector` entry, in order. Becomes the bind parent
      name (`fuchsia.NAME`), so it must match the consuming driver's bind rules.
      Defaults to "usb-connector" when a single connector is referenced and this
      property is omitted; required when more than one connector is referenced.

  usb-connector-output-name:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Name of this connector on the provider node, selecting between multiple
      connectors exposed by one provider. Becomes a bind rule (`fuchsia.NAME`),
      defaulting to "usb-connector" when omitted.

additionalProperties: true

examples:
  - |
    spmi@53f1000 {
        tcpc: tcpc@4 {
            reg = <0x04 0x00>;
            reg-names = "tcpc";
        };
    };

    usb_phy: usb-phy@c410000 {
        compatible = "test-usb-phy";
        reg = <0x0 0xc410000 0x0 0x10000>;
        usb-connector = <&tcpc>;
    };
