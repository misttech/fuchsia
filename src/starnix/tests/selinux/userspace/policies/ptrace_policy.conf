# Attribute for parent domains in ptrace tests.
attribute test_ptrace_parent_a;

# Attribute for child domains in ptrace tests.
attribute test_ptrace_child_a;

# Allow parent domains to set the "exec" context, and to modify
# the process' capability sets.
allow test_ptrace_parent_a self:process { setexec getcap setcap };

# Allow parent domains to execute files in data/bin/.
allow test_ptrace_parent_a file_t:file { read execute };

# Allow the parent domains to transition to the child domains.
allow test_ptrace_parent_a test_ptrace_child_a:process { transition getcap };

# Allow the child domains to use files in data/bin/ as entry points.
allow test_ptrace_child_a file_t:file { read entrypoint };

# Allow child domains to use file descriptors labeled with the parent contexts.
allow test_ptrace_child_a test_ptrace_parent_a:fd { use };

# Allow use of included files and shared libraries.
allow test_ptrace_parent_a unlabeled_t:file { read getattr map execute };
allow test_ptrace_child_a file_t:dir { getattr };
allow test_ptrace_child_a file_t:file { read getattr map execute };
allow test_ptrace_child_a self:lnk_file { read };

# Allow child domains to read their own files.
allow test_ptrace_child_a self:file { read };

# A child domain.
type test_ptrace_child_t, test_ptrace_child_a, test_a;

# A parent domain that has the `ptrace` permission for child domains.
type test_ptrace_parent_allow_t, test_ptrace_parent_a, test_a;
allow test_ptrace_parent_allow_t test_ptrace_child_a:process { ptrace };

# A parent domain that has both `ptrace` for child domains and `sys_ptrace` capability.
type test_ptrace_parent_allow_sys_ptrace_t, test_ptrace_parent_a, test_a;
allow test_ptrace_parent_allow_sys_ptrace_t test_ptrace_child_a:process { ptrace };
allow test_ptrace_parent_allow_sys_ptrace_t self:capability { sys_ptrace };

# A parent domain that does not have the `ptrace` permission for child domains.
type test_ptrace_parent_deny_t, test_ptrace_parent_a, test_a;
neverallow test_ptrace_parent_deny_t test_ptrace_child_a:process { ptrace };

# A parent domain that does not have the `ptrace` permission for child domains, but does have `read`.
type test_ptrace_parent_deny_ptrace_allow_read_t, test_ptrace_parent_a, test_a;
neverallow test_ptrace_parent_deny_ptrace_allow_read_t test_ptrace_child_a:process { ptrace };
allow test_ptrace_parent_deny_ptrace_allow_read_t test_ptrace_child_a:dir { search };
allow test_ptrace_parent_deny_ptrace_allow_read_t test_ptrace_child_a:file { read };

# A domain whose processes drop privileges, and which does not have the `ptrace` permission to
# itself.
type test_ptrace_drop_privs_t, test_a;
neverallow test_ptrace_drop_privs_t self:process { ptrace };
allow test_ptrace_drop_privs_t self:capability { kill setgid setuid };
allow test_ptrace_drop_privs_t self:process { signal sigkill sigstop };

# Allow parents to send signals to children or themselves, including SIGKILL if needed to clean up a test.
allow test_ptrace_parent_a self:process { signal sigkill };
allow test_ptrace_parent_a test_ptrace_child_a:process { signal sigkill };

# Allow parents and children to send SIGSTOP to themselves.
allow test_ptrace_parent_a self:process { sigstop };
allow test_ptrace_child_a self:process { sigstop };

# Allow ptrace within the parent domains.
allow test_ptrace_parent_a self:process { ptrace };

# The statements below are only needed on Linux, not on Starnix.

# Allow the child domains to use files in /data/bin as an entry point.
allow test_ptrace_child_a unlabeled_t:dir { getattr };
allow test_ptrace_child_a unlabeled_t:file { getattr read map execute entrypoint };

# Allow root test processes to change UIDs (`setresuid`/`seteuid`) and bypass DAC checks.
allow test_ptrace_parent_a self:capability { dac_read_search dac_override setuid };

# Allow `execve` transitions from parent to child domains without `AT_SECURE`.
allow test_ptrace_parent_a test_ptrace_child_a:process { noatsecure };

# Allow unbounded transitions despite running from a nosuid-mounted package.
policycap nnp_nosuid_transition;
allow test_a test_a:process2 { nosuid_transition };
