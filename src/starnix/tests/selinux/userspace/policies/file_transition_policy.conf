# Allow tmpfs_t to associate with its own filesystem for ScopedTempDir.
allow tmpfs_t self:filesystem { associate };

# Define transition for files created in unlabeled filesystems.
type unlabeled_unconfined_file_t;
typeattribute unlabeled_unconfined_file_t file_like_a;
type_transition unconfined_t unlabeled_t:file unlabeled_unconfined_file_t;
